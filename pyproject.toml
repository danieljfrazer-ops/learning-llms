[project]
name = "learning-llms-lab"
version = "0.1.0"
description = "Small language-model experiments explained by a living wiki"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
apple = ["mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
linux-cpu = ["mlx[cpu]==0.32.0; sys_platform == 'linux'"]
linux-cuda12 = ["mlx[cuda12]==0.32.0; sys_platform == 'linux'"]
linux-cuda13 = ["mlx[cuda13]==0.32.0; sys_platform == 'linux'"]

[tool.uv]
package = false
